<!-- Delete Confirmation Modal Dialog -->
<dialog id="confirmation-modal-dialog" closedby="any" aria-labelledby="confirmation-modal-title" class="rounded-2xl p-0 bg-white border border-gray-200">
  <div class="p-6">
    <div class="flex items-center space-x-3 mb-3">
      <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <div>
        <h3 id="confirmation-modal-title" class="text-sm font-bold text-gray-900">Confirm Deletion</h3>
        <p class="text-xs text-gray-500">This action can be undone only by reloading the demo session.</p>
      </div>
    </div>

    <p id="confirmation-modal-message" class="text-xs text-gray-600 my-4 leading-relaxed bg-gray-50 p-3 rounded-lg border border-gray-100">
      Are you sure you want to delete this item?
    </p>

    <div class="flex items-center justify-end space-x-2 pt-2 border-t border-gray-100">
      <button type="button" data-action="close-dialog" class="px-4 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
        Cancel
      </button>
      <button type="button" id="btn-confirm-delete" class="px-4 py-2 text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-lg transition-colors shadow-xs">
        Delete Item
      </button>
    </div>
  </div>
</dialog>
