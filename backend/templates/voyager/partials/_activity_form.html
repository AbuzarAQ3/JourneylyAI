<!-- Activity Modal Dialog -->
<dialog id="activity-modal-dialog" closedby="any" aria-labelledby="activity-modal-title" class="rounded-2xl p-0 bg-white border border-gray-200">
  <div class="p-6">
    
    <div class="flex items-center justify-between pb-3 mb-4 border-b border-gray-100">
      <h3 id="activity-modal-title" class="text-base font-bold text-voyager-graphite">Add Activity</h3>
      <button type="button" data-action="close-dialog" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg hover:bg-gray-100 transition-colors" aria-label="Close dialog">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form id="activity-modal-form" class="space-y-3.5">
      
      <!-- Title -->
      <div>
        <label for="act-title-input" class="block text-xs font-semibold text-gray-700 mb-1">Activity Title</label>
        <input type="text" id="act-title-input" required placeholder="e.g. Louvre Guided Tour, Sunset Dinner, Park Hike" class="w-full px-3 py-2 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-voyager-rose focus:border-transparent" />
      </div>

      <!-- Destination Stay & Date -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="act-stay-select" class="block text-xs font-semibold text-gray-700 mb-1">Destination Stop</label>
          <select id="act-stay-select" required class="w-full px-3 py-2 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-voyager-rose focus:border-transparent bg-white">
            <!-- Populated dynamically -->
          </select>
        </div>
        <div>
          <label for="act-date-input" class="block text-xs font-semibold text-gray-700 mb-1">Scheduled Date</label>
          <input type="date" id="act-date-input" required class="w-full px-3 py-2 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-voyager-rose focus:border-transparent" />
        </div>
      </div>

      <!-- Category & Duration -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="act-category-select" class="block text-xs font-semibold text-gray-700 mb-1">Category</label>
          <select id="act-category-select" class="w-full px-3 py-2 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-voyager-rose focus:border-transparent bg-white">
            <option value="Sightseeing">Sightseeing</option>
            <option value="Culture">Culture</option>
            <option value="Dining">Dining</option>
            <option value="Nature">Nature</option>
            <option value="Relaxation">Relaxation</option>
            <option value="Transit">Transit</option>
          </select>
        </div>
        <div>
          <label for="act-duration-input" class="block text-xs font-semibold text-gray-700 mb-1">Duration (Minutes)</label>
          <input type="number" id="act-duration-input" min="15" step="15" value="60" class="w-full px-3 py-2 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-voyager-rose focus:border-transparent" />
        </div>
      </div>

      <!-- Start Time with Standard Presets (09:00, 14:00, 18:00, 21:00) -->
      <div>
        <label for="act-time-input" class="block text-xs font-semibold text-gray-700 mb-1">Start Time (Optional)</label>
        <div class="flex items-center space-x-2">
          <input type="time" id="act-time-input" class="w-36 px-3 py-1.5 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-voyager-rose focus:border-transparent" />
          <div class="flex space-x-1 flex-wrap gap-1">
            <button type="button" class="time-preset-btn px-2 py-1 text-[11px] bg-gray-100 hover:bg-gray-200 rounded text-gray-700 font-medium" data-target-input="act-time-input" data-time="09:00">Morning (09:00)</button>
            <button type="button" class="time-preset-btn px-2 py-1 text-[11px] bg-gray-100 hover:bg-gray-200 rounded text-gray-700 font-medium" data-target-input="act-time-input" data-time="14:00">Afternoon (14:00)</button>
            <button type="button" class="time-preset-btn px-2 py-1 text-[11px] bg-gray-100 hover:bg-gray-200 rounded text-gray-700 font-medium" data-target-input="act-time-input" data-time="18:00">Evening (18:00)</button>
            <button type="button" class="time-preset-btn px-2 py-1 text-[11px] bg-gray-100 hover:bg-gray-200 rounded text-gray-700 font-medium" data-target-input="act-time-input" data-time="21:00">Night (21:00)</button>
          </div>
        </div>
      </div>

      <!-- Specific Location / POI name -->
      <div>
        <label for="act-location-input" class="block text-xs font-semibold text-gray-700 mb-1">Venue / Landmark / Address (Optional)</label>
        <input type="text" id="act-location-input" placeholder="e.g. Musée d'Orsay, Esplanade des Invalides" class="w-full px-3 py-2 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-voyager-rose focus:border-transparent" />
      </div>

      <!-- Notes -->
      <div>
        <label for="act-notes-input" class="block text-xs font-semibold text-gray-700 mb-1">Notes & Tips</label>
        <textarea id="act-notes-input" rows="2" placeholder="Ticket references, dress codes, meetup details..." class="w-full px-3 py-2 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-voyager-rose focus:border-transparent"></textarea>
      </div>

      <!-- Form Actions -->
      <div class="flex items-center justify-end space-x-2 pt-4 border-t border-gray-100">
        <button type="button" data-action="close-dialog" class="px-4 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
          Cancel
        </button>
        <button type="submit" class="px-5 py-2 text-xs font-bold text-white bg-voyager-graphite hover:bg-black rounded-lg transition-colors shadow-xs">
          Save Activity
        </button>
      </div>

    </form>
  </div>
</dialog>
