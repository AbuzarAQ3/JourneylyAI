<!-- Weather Foresight Panel Component -->
<section aria-labelledby="weather-heading" class="flex flex-col h-full">
  <div class="flex items-center justify-between mb-3">
    <div>
      <h3 id="weather-heading" class="text-sm font-bold uppercase tracking-wider text-voyager-graphite">Weather Foresight</h3>
      <p class="text-[11px] text-gray-500">Destination forecast & hourly alignment</p>
    </div>
    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-gray-100 text-gray-600">
      Simulated Data
    </span>
  </div>

  <div id="weather-panel-content" class="custom-scroll overflow-y-auto max-h-[calc(100vh-210px)] pr-1">
    <!-- Rendered dynamically by VoyagerApp.renderWeatherPanel() -->
    <div class="h-64 flex flex-col items-center justify-center p-6 text-center text-gray-400">
      <svg class="w-10 h-10 mb-2 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z" />

      <p class="text-xs font-semibold text-gray-600">Select an itinerary day</p>
      <p class="text-[11px] text-gray-400 mt-1">Weather foresight updates automatically based on the chosen destination and date.</p>
    </div>
  </div>
</section>
