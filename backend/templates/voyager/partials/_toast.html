<!-- Toast Notification Container -->
<aside aria-label="Notifications" class="fixed bottom-5 right-5 z-50 pointer-events-none">
  <div id="voyager-toast" role="status" aria-live="polite" class="transform translate-y-20 opacity-0 transition-all duration-300 ease-out bg-voyager-graphite text-white px-4 py-3 rounded-xl shadow-lg border border-gray-700/50 flex items-center space-x-2.5 max-w-sm pointer-events-auto">
    <div class="w-2 h-2 rounded-full bg-voyager-pink shrink-0 animate-pulse"></div>
    <span id="voyager-toast-message" class="text-xs font-medium">Notification</span>
  </div>
</aside>
