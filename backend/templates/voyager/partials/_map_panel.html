<!-- map panel -->
<section aria-label="Interactive journey map" class="flex flex-col h-full">
    <div class="flex items-center justify-between mb-3">
        <div>
            <h3 class="text-sm font-bold uppercase tracking-wider text-voyager-graphite">
                Interactive Journey Map
            </h3>
            <p class="text-[11px] text-gray-500">
                Spatial overview & stops sequence
            </p>
        </div>

        <span
            class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-voyager-pink/40 text-voyager-graphite"
            title="Connectors are illustrative, not road routes."
        >
            Illustrative Route
        </span>
    </div>

    <div class="relative flex-1 w-full min-h-[300px] md:min-h-[500px] rounded-xl overflow-hidden border border-gray-200 bg-gray-100 shadow-xs">
        <div
            class="voyager-map w-full h-full min-h-[300px] md:min-h-[500px]"
            data-map-key="{{ MAPTILER_MAP_KEY }}"
        ></div>
    </div>
</section>
