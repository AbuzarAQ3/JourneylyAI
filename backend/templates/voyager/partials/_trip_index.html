<!-- Trip Index Assessment Component -->
<section aria-labelledby="trip-index-heading" class="mb-4">
  <h3 id="trip-index-heading" class="sr-only">Trip Robustness Index</h3>
  <div id="trip-index-card">
    <!-- Populated dynamically by VoyagerApp.renderTripIndex() -->
    <div class="p-4 bg-white border border-gray-200 rounded-xl">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold uppercase tracking-wider">Trip Index</span>
        <span
          class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-gray-100 text-gray-600">Pending</span>
      </div>
      <div class="flex items-baseline space-x-2">
        <span class="text-3xl font-extrabold text-gray-300">0.5</span>
        <span class="text-xs text-gray-400">/ 1</span>
      </div>
      <p class="text-xs text-gray-500 mt-2">Add your first destination and activities to calculate plan stability and
        weather foresight.</p>
    </div>
  </div>
</section>
