{% load static %}
<!-- Voyager Studio Header -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand & Trip Title -->
      <div class="flex items-center space-x-4">
        <a href="{% url 'home' %}" class="flex items-center space-x-2 shrink-0 group">
          <img src="{% static 'img/fav/favicon-96x96.png' %}" alt="JourneylyAI" class="w-8 h-8 rounded-lg shadow-xs transition-transform group-hover:scale-105" />
          <span class="text-lg font-black tracking-tight text-voyager-graphite hidden sm:inline">JourneylyAI</span>
        </a>

        <div class="h-6 w-px bg-gray-200 hidden sm:block"></div>

        <div>
          <div class="flex items-center space-x-2">
            <h1 id="trip-title-display" class="text-sm font-bold text-gray-900 truncate max-w-[200px] sm:max-w-xs md:max-w-md">
              Voyager Studio
            </h1>
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold bg-voyager-pink/50 text-voyager-graphite">
              Studio
            </span>
          </div>
          <p id="trip-dates-display" class="text-[11px] text-gray-500 truncate">
            Connected Itinerary Workspace
          </p>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center space-x-2.5">
        <button type="button" data-action="open-add-destination" class="inline-flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-voyager-graphite text-white hover:bg-black transition-colors shadow-xs">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          <span class="hidden sm:inline">Add Destination</span>
          <span class="sm:hidden">Add</span>
        </button>

        <button type="button" id="btn-reset-trip" data-action="reset-trip" class="hidden px-2.5 py-1.5 text-xs font-medium text-gray-600 hover:text-rose-600 hover:bg-gray-100 rounded-lg transition-colors" title="Reset Demo Trip">
          Reset
        </button>

        <a href="{% url 'home' %}" class="p-1.5 text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100 transition-colors" title="Back to Home">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </a>
      </div>

    </div>
  </div>
</header>
